<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Letter Challenge - Multiplayer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-500 to-pink-500">
  <div id="app" class="flex items-center justify-center min-h-screen p-4"></div>

  <script>
    // 🔑 CONFIGURAZIONE FIREBASE – SOSTITUISCI CON LA TUA!
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-project.firebaseapp.com",
      databaseURL: "https://your-project-default-rtdb.firebaseio.com",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Lista città italiane
    const ITALIAN_CITIES = [
      "Abbiategrasso", "Acireale", "Adria", "Agrigento", "Alessandria", "Ancona", "Andria", "Arezzo",
      "Ascoli Piceno", "Asti", "Avellino", "Bari", "Barletta", "Belluno", "Benevento", "Bergamo",
      "Biella", "Bologna", "Bolzano", "Brescia", "Brindisi", "Cagliari", "Caltanissetta", "Campobasso",
      "Caserta", "Catania", "Catanzaro", "Chieti", "Como", "Cosenza", "Cremona", "Crotone", "Cuneo",
      "Empoli", "Enna", "Fermo", "Ferrara", "Firenze", "Foggia", "Forlì", "Frosinone", "Genova",
      "Gorizia", "Grosseto", "Imperia", "Isernia", "La Spezia", "L'Aquila", "Latina", "Lecce",
      "Lecco", "Livorno", "Lodi", "Lucca", "Macerata", "Mantova", "Massa", "Matera", "Messina",
      "Milano", "Modena", "Monza", "Napoli", "Novara", "Nuoro", "Olbia", "Oristano", "Padova",
      "Palermo", "Parma", "Pavia", "Perugia", "Pesaro", "Pescara", "Piacenza", "Pisa", "Pistoia",
      "Pordenone", "Potenza", "Prato", "Ragusa", "Ravenna", "Reggio Calabria", "Reggio Emilia",
      "Rieti", "Rimini", "Roma", "Rovigo", "Salerno", "Sassari", "Savona", "Siena", "Siracusa",
      "Sondrio", "Taranto", "Teramo", "Terni", "Torino", "Trapani", "Trento", "Treviso", "Trieste",
      "Udine", "Varese", "Venezia", "Verbania", "Vercelli", "Verona", "Vibo Valentia", "Vicenza",
      "Viterbo"
    ].map(c => c.toLowerCase());

    // Estrai room dall'URL o generane una nuova
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    const playerId = urlParams.get('player') || 'player' + Math.floor(Math.random() * 1000);

    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
      window.history.replaceState(null, null, `?room=${roomId}&player=${playerId}`);
    }

    const roomRef = db.ref(`rooms/${roomId}`);

    // Stato locale
    let state = {
      targetLetter: '',
      myAnswer: '',
      player1: { id: null, name: 'Giocatore 1', score: 0, answered: false },
      player2: { id: null, name: 'Giocatore 2', score: 0, answered: false },
      message: '',
      gameOver: false,
      winner: null
    };

    // Inizializza o unisciti alla stanza
    roomRef.once('value', (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.targetLetter) {
        // Crea nuova stanza
        const letters = 'ABCDEFGHILMNOPQRSTUXVZ';
        const letter = letters[Math.floor(Math.random() * letters.length)];
        roomRef.set({
          targetLetter: letter,
          player1: { id: playerId, score: 0, answered: false },
          player2: { id: null, score: 0, answered: false },
          turn: 1,
          gameOver: false,
          winner: null
        });
        state.player1.id = playerId;
      } else {
        // Unisciti alla stanza
        if (!data.player1.id) {
          roomRef.child('player1/id').set(playerId);
          state.player1.id = playerId;
        } else if (!data.player2.id) {
          roomRef.child('player2/id').set(playerId);
          state.player2.id = playerId;
        } else if (data.player1.id === playerId) {
          state.player1.id = playerId;
        } else if (data.player2.id === playerId) {
          state.player2.id = playerId;
        } else {
          alert('Stanza piena!');
          return;
        }
      }
      syncState();
    });

    // Ascolta aggiornamenti in tempo reale
    roomRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      state.targetLetter = data.targetLetter;
      state.player1 = { ...data.player1, name: 'Giocatore 1' };
      state.player2 = { ...data.player2, name: 'Giocatore 2' };
      state.gameOver = data.gameOver;
      state.winner = data.winner;
      state.message = '';

      render();
    });

    function checkAnswer() {
      const input = state.myAnswer.trim().toLowerCase();
      if (!input) {
        state.message = '⚠️ Inserisci una città!';
        render();
        return;
      }

      const isMyTurn = (state.player1.id === playerId && !state.player1.answered) ||
                       (state.player2.id === playerId && !state.player2.answered);

      if (!isMyTurn) return;

      const startsWithLetter = input[0].toUpperCase() === state.targetLetter;
      const isItalianCity = ITALIAN_CITIES.includes(input);

      const playerKey = state.player1.id === playerId ? 'player1' : 'player2';

      if (startsWithLetter && isItalianCity) {
        roomRef.child(`${playerKey}/score`).transaction(score => (score || 0) + 1);
        state.message = '✅ Corretto!';
      } else {
        state.message = '❌ Città non valida!';
      }

      roomRef.child(`${playerKey}/answered`).set(true);

      // Controlla fine partita
      setTimeout(() => {
        roomRef.once('value', (snap) => {
          const d = snap.val();
          if (d.player1.answered && d.player2.answered) {
            if (d.player1.score >= 5 || d.player2.score >= 5) {
              roomRef.update({
                gameOver: true,
                winner: d.player1.score >= 5 ? 'player1' : 'player2'
              });
            } else {
              // Nuova lettera
              const letters = 'ABCDEFGHILMNOPQRSTUXVZ';
              const newLetter = letters[Math.floor(Math.random() * letters.length)];
              roomRef.update({
                targetLetter: newLetter,
                'player1/answered': false,
                'player2/answered': false
              });
            }
          }
        });
      }, 1500);

      render();
    }

    function resetGame() {
      const letters = 'ABCDEFGHILMNOPQRSTUXVZ';
      const letter = letters[Math.floor(Math.random() * letters.length)];
      roomRef.set({
        targetLetter: letter,
        player1: { id: state.player1.id, score: 0, answered: false },
        player2: { id: state.player2.id, score: 0, answered: false },
        gameOver: false,
        winner: null
      });
    }

    function render() {
      const app = document.getElementById('app');

      if (state.gameOver) {
        const winnerName = state.winner === 'player1' ? 'Giocatore 1' : 'Giocatore 2';
        app.innerHTML = `
          <div class="max-w-2xl w-full">
            <div class="bg-white rounded-3xl shadow-2xl p-8 text-center">
              <div class="text-8xl">🏆</div>
              <h2 class="text-4xl font-bold mt-4">${winnerName} vince!</h2>
              <p class="text-xl text-gray-700 mb-6">
                ${state.player1.score} - ${state.player2.score}
              </p>
              <button onclick="resetGame()" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 px-8 rounded-xl font-bold text-lg">
                🔄 Nuova Partita
              </button>
              <p class="mt-4 text-sm text-gray-500">Condividi questo link con un amico:<br>
                <code class="bg-gray-100 p-1 rounded">${window.location.href.split('&player')[0]}</code>
              </p>
            </div>
          </div>
        `;
        return;
      }

      const myPlayer = state.player1.id === playerId ? state.player1 : state.player2;
      const otherPlayer = state.player1.id === playerId ? state.player2 : state.player1;

      app.innerHTML = `
        <div class="max-w-2xl w-full">
          <div class="bg-white rounded-3xl shadow-2xl p-6 text-center">
            <div class="mb-4">
              <span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-bold">
                Stanza: ${roomId}
              </span>
              <p class="text-gray-600 mt-2">Condividi il link con un amico!</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
              <div class="bg-blue-100 rounded-xl p-3">
                <div class="font-bold text-blue-800">Giocatore 1</div>
                <div class="text-3xl font-bold text-blue-600">${state.player1.score}</div>
              </div>
              <div class="bg-pink-100 rounded-xl p-3">
                <div class="font-bold text-pink-800">Giocatore 2</div>
                <div class="text-3xl font-bold text-pink-600">${state.player2.score}</div>
              </div>
            </div>

            <div class="mb-6">
              <p class="text-gray-700 mb-3">Città che inizia con:</p>
              <div class="inline-block bg-gradient-to-br from-indigo-500 to-purple-600 text-white w-24 h-24 rounded-2xl flex items-center justify-center mx-auto">
                <span class="text-5xl font-bold">${state.targetLetter}</span>
              </div>
            </div>

            <div class="space-y-4">
              <input
                type="text"
                id="answerInput"
                placeholder="Es. Roma..."
                class="w-full px-4 py-3 text-lg border-2 border-purple-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
                onkeypress="if(event.key==='Enter') checkAnswer()"
              />
              <button
                onclick="checkAnswer()"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-xl font-bold"
                ${myPlayer.answered ? 'disabled' : ''}
              >
                ${myPlayer.answered ? '✅ Inviato' : 'Invia Città'}
              </button>
            </div>

            ${state.message ? `
              <div class="mt-4 p-3 rounded-xl font-semibold ${
                state.message.includes('✅') ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
              }">
                ${state.message}
              </div>
            ` : ''}

            <div class="mt-6 text-sm text-gray-500">
              ${otherPlayer.id ? '✅ Avversario connesso' : '⏳ In attesa di un avversario...'}
            </div>
          </div>
        </div>
      `;

      const input = document.getElementById('answerInput');
      if (input && !myPlayer.answered) {
        input.addEventListener('input', e => state.myAnswer = e.target.value);
        input.focus();
      }
    }

    // Inizializza interfaccia
    render();
  </script>
</body>
</html>
